{% extends "base.html" %}

{% block title %}Register - Green Workspace{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Create Account</h2>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="form-group">
                <label for="security_question">Security Question</label>
                <select id="security_question" name="security_question" required>
                    <option value="">Select a question...</option>
                    <option value="What was the name of your first pet?">What was the name of your first pet?</option>
                    <option value="What city were you born in?">What city were you born in?</option>
                    <option value="What is your favorite color?">What is your favorite color?</option>
                    <option value="What was your childhood nickname?">What was your childhood nickname?</option>
                </select>
            </div>
            <div class="form-group">
                <label for="security_answer">Answer</label>
                <input type="text" id="security_answer" name="security_answer" required autocomplete="off">
            </div>
            <button type="submit" class="btn primary-btn">Sign Up</button>
        </form>
        <p class="auth-footer">Already have an account? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</div>
{% endblock %}
