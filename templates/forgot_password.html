{% extends "base.html" %}

{% block title %}Forgot Password - Green Workspace{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2>Forgot Password</h2>
        <p style="text-align:center; color:#555; margin-bottom:1.5rem;">Enter your username to begin recovery.</p>

        <form method="POST" action="{{ url_for('forgot_password') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="off">
            </div>
            <button type="submit" class="btn primary-btn">Continue</button>
        </form>
        <p class="auth-footer"><a href="{{ url_for('login') }}">Back to Login</a></p>
    </div>
</div>
{% endblock %}
